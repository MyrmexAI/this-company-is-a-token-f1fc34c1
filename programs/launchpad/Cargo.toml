[package]
name = "antpad-launchpad"
version = "0.1.0"
edition = "2021"
description = "AntPad launchpad registry: records pump.fun launches and charges a platform fee"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"

[dev-dependencies]
litesvm = "0.18.0"
solana-account = "4.3.0"
solana-address = { version = "~2.7.0", features = ["curve25519"] }
solana-clock = "~3.2.0"
solana-instruction = "~3.5.0"
solana-instruction-error = "~2.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["blake3"] }
solana-transaction-error = "~3.4.0"
